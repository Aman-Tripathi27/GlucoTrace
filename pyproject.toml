[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "glucotrace"
version = "0.2.1"
description = "A small, readable Transformer encoder for research with continuous glucose monitor time series."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "GlucoTrace contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
keywords = [
  "continuous glucose monitoring",
  "CGM",
  "time series",
  "representation learning",
  "transformer",
  "self-supervised learning",
]
dependencies = [
  "numpy>=1.24",
  "torch>=2.1",
]

[project.urls]
Homepage = "https://github.com/Aman-Tripathi27/GlucoTrace"
Repository = "https://github.com/Aman-Tripathi27/GlucoTrace"
Issues = "https://github.com/Aman-Tripathi27/GlucoTrace/issues"

[project.optional-dependencies]
dev = ["pytest>=7.4", "build>=1.2"]

[project.scripts]
glucotrace = "glucofm.cli:main"
glucofm-train = "glucofm.train:main"
glucofm-prepare-big-ideas = "glucofm.adapters.big_ideas:main"
glucofm-prepare-colas = "glucofm.adapters.colas:main"
glucofm-pretrain = "glucofm.pretrain:main"
glucofm-evaluate = "glucofm.evaluate:main"
glucofm-calibrate = "glucofm.calibrate:main"
glucofm-encode = "glucofm.commands:encode_main"
glucofm-compare = "glucofm.commands:compare_main"
glucofm-search = "glucofm.commands:search_main"
glucofm-report = "glucofm.report:main"
glucofm-download-model = "glucofm.commands:download_main"
glucofm-reserve-holdout = "glucofm.reserve:main"
glucofm-split-corpus = "glucofm.corpus:main"

[tool.setuptools.packages.find]
include = ["glucofm*", "glucotrace*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
