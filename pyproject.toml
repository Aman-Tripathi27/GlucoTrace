[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "glucotrace"
version = "0.3.0"
description = "A small, readable Transformer encoder for research with continuous glucose monitor time series."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "GlucoTrace contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
keywords = [
  "continuous glucose monitoring",
  "CGM",
  "time series",
  "representation learning",
  "transformer",
  "self-supervised learning",
]
dependencies = [
  "numpy>=1.24",
  "torch>=2.1",
]

[project.urls]
Homepage = "https://github.com/Aman-Tripathi27/GlucoTrace"
Repository = "https://github.com/Aman-Tripathi27/GlucoTrace"
Issues = "https://github.com/Aman-Tripathi27/GlucoTrace/issues"

[project.optional-dependencies]
shanghai = ["pandas>=2.0", "openpyxl>=3.1", "xlrd>=2.0"]
dev = ["pytest>=7.4", "build>=1.2", "pandas>=2.0", "openpyxl>=3.1", "xlrd>=2.0"]

[project.scripts]
glucotrace = "glucotrace.cli:main"

[tool.setuptools.packages.find]
include = ["glucotrace*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
